name: APK Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "server/**"
      - "web/**"
      - "pyide_gui.py"
      - "pyide_native.py"
      - "sitecustomize.py"
      - ".github/workflows/android.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python 3.11 (pour Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier python3.11
        run: |
          which python3.11 || ln -sf "$(which python3)" "$(dirname "$(which python3)")/python3.11"
          python3.11 --version

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Annoter l'échec (lisible via l'API)
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("/tmp/build.log")
          text = log.read_text(errors="replace") if log.exists() else "journal absent"
          tail = "\n".join(text.strip().splitlines()[-45:])
          tail = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Gradle::" + tail)
          PY

      - name: Publier le journal en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Échec du build APK — fin du journal"
            echo '```'
            tail -c 30000 /tmp/build.log 2>/dev/null || echo "(journal indisponible)"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || true

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-py-ide-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'APK en release GitHub
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          if gh release view android-v3.0.0 >/dev/null 2>&1; then
            gh release upload android-v3.0.0 "$APK" --clobber
          else
            gh release create android-v3.0.0 "$APK" \
              --target "$GITHUB_SHA" \
              --title "Mobile Py IDE 3.0 — APK Android" \
              --notes "APK debug de Mobile Py IDE 3.0 (Python 3.11 embarqué, Monaco hors ligne, éditeur/sortie séparés, entrée interactive, paquets et écran graphique)."
          fi

      - name: Résumé du binaire
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "### APK prêt : $(basename "$APK")"
            echo '```'
            ls -lh "$APK"
            unzip -l "$APK" | sort -k1 -n -r | head -12
            echo "..."
            unzip -l "$APK" | grep -E "python-src.zip|assets/web/index.html|libpython" | head -8
            echo '```'
            echo
            echo "### Shims graphiques embarqués"
            echo '```'
            unzip -p "$APK" assets/python-src.zip > /tmp/python-src.zip
            unzip -l /tmp/python-src.zip | grep -E "shims/" | head -40
            echo '```'
          } > /tmp/summary.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/summary.md || true
