name: APK Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "server/**"
      - "web/**"
      - "pyide_gui.py"
      - "pyide_native.py"
      - "sitecustomize.py"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python 3.11 (pour Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier python3.11
        run: |
          which python3.11 || ln -sf "$(which python3)" "$(dirname "$(which python3)")/python3.11"
          python3.11 --version

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publier le journal en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Échec du build APK — fin du journal"
            echo '```'
            tail -c 30000 /tmp/build.log 2>/dev/null || echo "(journal indisponible)"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || true

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-py-ide-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Taille de l'APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
